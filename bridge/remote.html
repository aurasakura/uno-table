<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNO phone remote</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#171717;color:#fff;font:18px system-ui}main{max-width:560px;margin:auto}h1{font-size:26px;margin:8px 0}p{line-height:1.4}button{min-height:64px;border:2px solid #666;border-radius:12px;background:#333;color:white;font:700 22px system-ui;touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45}.colours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.colours button{font-size:16px}.colours [aria-pressed=true]{outline:4px solid white;outline-offset:2px}a{color:#9ae6b4}#status{min-height:3em}#error{color:#fca5a5}</style></head><body><main>
<h1>UNO phone remote</h1><p>Choose a colour, then tap a card. Open the projector and click its start screen to enable sound.</p>
<div class="colours" aria-label="Card colour"><button data-colour="red" style="background:#b71922" aria-pressed="true">Red</button><button data-colour="blue" style="background:#005ca8" aria-pressed="false">Blue</button><button data-colour="green" style="background:#007b35" aria-pressed="false">Green</button><button data-colour="yellow" style="background:#ebba00;color:#111" aria-pressed="false">Yellow</button></div>
<div id="pad" class="pad"></div><p id="status" role="status">Connecting...</p><p id="error" role="alert"></p><p><a href="/controls">Input mode and camera controls</a></p>
</main><script>
let colour='red',pending=false,enabled=false;
const status=document.getElementById('status'),error=document.getElementById('error');
for(const button of document.querySelectorAll('[data-colour]'))button.onclick=()=>{colour=button.dataset.colour;for(const b of document.querySelectorAll('[data-colour]'))b.setAttribute('aria-pressed',String(b===button))};
const cards=[...Array.from({length:10},(_,i)=>[String(i),String(i)]),['Skip','skip'],['Reverse','reverse'],['+2','draw2'],['Wild','wild'],['+4','wild4'],['UNO!','uno'],['Draw','draw'],['Win!','win']];
function lock(){for(const b of document.querySelectorAll('[data-symbol]'))b.disabled=pending||!enabled}
for(const [label,symbol] of cards){const b=document.createElement('button');b.textContent=label;b.dataset.symbol=symbol;b.disabled=true;b.onclick=async()=>{if(pending||!enabled)return;pending=true;lock();error.textContent='';try{const r=await fetch('/api/inject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({colour,symbol})});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);status.textContent='Sent '+data.last_card.colour+' '+data.last_card.symbol+' (event '+data.event_id+')'}catch(e){error.textContent=e.message}finally{pending=false;lock()}};document.getElementById('pad').append(b)}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();enabled=s.mode==='manual'||s.mode==='both';if(!enabled)status.textContent='Auto mode: select Manual or Both in controls.';else if(!pending&&status.textContent==='Connecting...')status.textContent='Ready. '+s.mode+' mode.'}catch(e){enabled=false;error.textContent='Server unavailable: '+e.message}lock();setTimeout(poll,1000)}poll();
</script></body></html>
